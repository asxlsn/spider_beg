name: Run xy_feed

on:
  schedule:
    # 北京时间 9:00 / 17:00 / 次日1:00 (UTC 1:00 / 9:00 / 17:00)
    - cron: '0 1,9,17 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run spider
        env:
          XY_COOKIE: ${{ secrets.XY_COOKIE }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: python xy_feed.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xy_seen_ids.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "update xy_seen_ids" && git push
