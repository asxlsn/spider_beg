name: Run yx_spider

on:
  schedule:
    - cron: '17 */1 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pycryptodome

      - name: Run spider
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: python yx_spider.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "update seen_ids" && git push
